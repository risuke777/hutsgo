{# 写真 1 枚。1600 と 800 の 2 サイズを srcset で出し分ける。role に応じて呼び出し側が figure で包む #}
{% macro img(p, sizes="(max-width: 760px) 100vw, 720px", eager=false) -%}
<img src="{{ BASE }}/static/img/{{ p.file }}.jpg"
     srcset="{{ BASE }}/static/img/{{ p.file }}-800.jpg 800w, {{ BASE }}/static/img/{{ p.file }}.jpg 1600w"
     sizes="{{ sizes }}" width="1600" height="901" alt="{{ p.alt }}"{% if not eager %} loading="lazy" decoding="async"{% else %} fetchpriority="high"{% endif %}>
{%- endmacro %}
