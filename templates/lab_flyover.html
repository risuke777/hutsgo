<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>3D の山行ふりかえり（試作）| HutsGo Lab</title>
<meta name="hutsgo-api" content="{{ API_URL }}">
<meta name="hutsgo-lang" content="ja">
<link rel="icon" href="{{ BASE }}/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="{{ BASE }}/static/flyover.css">
</head>
<body>
<main class="fly">
  <header class="fly-head">
    <p class="fly-kicker"><a href="{{ BASE }}/">HutsGo</a> Lab ・試作</p>
    <h1>歩いた道を、3D でふりかえる</h1>
    <p class="fly-privacy">GPX・写真・動画は端末の外に出ません。</p>
  </header>

  <section class="fly-controls" aria-label="設定">
    <div class="fly-source" role="group" aria-label="道のデータ">
      <label class="fly-field">ルート
        <select id="fly-route"></select>
      </label>
      <label class="fly-field fly-file">GPX
        <input type="file" id="fly-gpx" accept=".gpx,application/gpx+xml,application/xml,text/xml">
      </label>
    </div>
    <label class="fly-field fly-file">写真・動画
      <input type="file" id="fly-files" accept="image/*,video/*" multiple>
    </label>
    <ol id="fly-list" class="fly-list" aria-live="polite"></ol>
    <div class="fly-buttons">
      <label class="fly-field fly-len">長さ
        <select id="fly-len">
          <option value="10">10 秒</option><option value="20" selected>20 秒</option>
          <option value="30">30 秒</option><option value="60">60 秒</option>
        </select>
      </label>
      <button type="button" id="fly-preview" class="fly-btn">プレビュー</button>
      <button type="button" id="fly-record" class="fly-btn fly-btn-primary">動画に書き出す</button>
    </div>
    <p id="fly-status" class="fly-status" role="status"></p>
  </section>

  <section class="fly-stage" aria-label="3D の地図">
    <div class="fly-phone">
      <div id="fly-map"></div>
      <canvas id="fly-out" width="720" height="1280" hidden></canvas>
      <div class="fly-top" aria-live="off">
        <p id="fly-date" class="fly-date"></p>
        <p id="fly-clock" class="fly-clock"></p>
        <p id="fly-place" class="fly-place"></p>
      </div>
      <button type="button" id="fly-add" class="fly-round fly-add" aria-label="写真・動画を足す">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M9 4 7.5 6H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1h-3.5L15 4H9Zm3 4.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Z" fill="currentColor"/></svg>
      </button>
      <figure id="fly-popup" class="fly-popup" hidden>
        <button type="button" id="fly-popup-close" class="fly-round fly-popup-close" aria-label="閉じる">×</button>
        <div id="fly-popup-media"></div>
        <figcaption id="fly-popup-cap"></figcaption>
      </figure>
      <div class="fly-panel">
        <dl class="fly-stats">
          <div><dt>経過時間</dt><dd id="fly-st-time">—</dd></div>
          <div><dt>標高</dt><dd id="fly-st-elev">—</dd></div>
          <div><dt>距離</dt><dd id="fly-st-dist">—</dd></div>
        </dl>
        <canvas id="fly-profile" class="fly-profile" width="640" height="120" aria-hidden="true"></canvas>
        <div class="fly-player">
          <button type="button" id="fly-play" class="fly-round fly-play" aria-label="再生">
            <svg class="i-play" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M7 5h4v14H7zm6 0h4v14h-4z" fill="currentColor"/></svg>
          </button>
          <input type="range" id="fly-seek" class="fly-seek" min="0" max="1000" value="0" step="1" aria-label="道の途中へ移動">
        </div>
      </div>
    </div>
  </section>

  <section id="fly-result" class="fly-result" hidden>
    <h2>できあがり</h2>
    <video id="fly-video" controls playsinline></video>
    <p><a id="fly-download" class="fly-btn fly-btn-primary" download>保存する</a></p>
    <p id="fly-format" class="fly-note"></p>
  </section>


  <footer class="fly-foot">
    <p>地図・山名: <a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a>　試作</p>
  </footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.min.js"></script>
<script src="{{ BASE }}/static/site.js" defer></script>
<script src="{{ BASE }}/static/flyover.js" defer></script>
</body>
</html>
