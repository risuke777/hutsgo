<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ルートを選ぶ | HutsGo</title>
<meta name="description" content="日数と行き方で絞って、北アルプスの縦走ルートを 3D で見比べる。">
<meta name="theme-color" content="#0f1a15">
<meta property="og:title" content="ルートを選ぶ | HutsGo">
<meta property="og:description" content="北アルプス・南アルプス・富士山の山小屋泊ルートを、3D の飛行で見比べる。">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ SITE_URL }}{{ BASE }}/lab/feed/">
<meta property="og:image" content="{{ SITE_URL }}{{ BASE }}/static/img/omote-tents-sunrise.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="hutsgo-api" content="{{ API_URL }}">
<link rel="icon" href="{{ BASE }}/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{ BASE }}/static/feed.css">
</head>
<body>
<header class="fd-top">
  <div class="fd-bar">
    <div class="fd-brandcol">
      <a class="fd-brand" href="{{ BASE }}/">HutsGo<span class="fd-beta">β</span></a>
      <a class="fd-make" href="{{ BASE }}/lab/flyover/" data-make aria-label="自分の山の動画を作る" title="自分の山の動画を作る"><span aria-hidden="true">＋</span></a>
    </div>
    <h1 class="fd-h1">ルートを選ぶ</h1>
    <button type="button" id="fd-filter-open" class="fd-pill fd-filter-btn" aria-expanded="false" aria-controls="fd-filters">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4-2v-4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span id="fd-filter-label">絞り込み</span><span class="fd-chev" aria-hidden="true">▾</span>
    </button>
    <button type="button" id="fd-compare-open" class="fd-pill" aria-label="保存したルートを比べる">★<b id="fd-saved-n">0</b></button>
  </div>
  <div id="fd-filters" class="fd-filters" role="group" aria-label="条件で絞る" hidden>
    <span class="fd-label" id="fd-l-n">日数</span>
    <div class="fd-chips" role="radiogroup" aria-labelledby="fd-l-n" data-group="nights">
      <button type="button" role="radio" data-v="">すべて</button>
      <button type="button" role="radio" data-v="1">1泊2日</button>
      <button type="button" role="radio" data-v="2">2泊3日</button>
      <button type="button" role="radio" data-v="3">3泊〜</button>
    </div>
    <span class="fd-label" id="fd-l-a">行き方</span>
    <div class="fd-chips" role="radiogroup" aria-labelledby="fd-l-a" data-group="access">
      <button type="button" role="radio" data-v="">どちらでも</button>
      <button type="button" role="radio" data-v="public">電車・バス</button>
      <button type="button" role="radio" data-v="car">マイカー</button>
    </div>
    <span class="fd-label" id="fd-l-s">体力度</span>
    <div class="fd-chips" role="radiogroup" aria-labelledby="fd-l-s" data-group="stamina">
      <button type="button" role="radio" data-v="">すべて</button>
      <button type="button" role="radio" data-v="6">〜6</button>
      <button type="button" role="radio" data-v="8">7〜8</button>
      <button type="button" role="radio" data-v="10">9〜</button>
    </div>
    <button type="button" id="fd-filter-done" class="fd-done"><span id="fd-count">0</span> ルートを見る</button>
  </div>
</header>

<iframe id="fd-player" class="fd-player" title="ルートの 3D の飛行" src="{{ BASE }}/lab/flyover/?embed=1" allow="autoplay"></iframe>
<main id="fd-feed" class="fd-feed" aria-label="ルート"></main>
<p id="fd-none" class="fd-none" hidden>この条件のルートはまだありません。条件をゆるめてください。</p>

<p id="fd-toast" class="fd-toast" role="status" aria-live="polite" hidden></p>

<section id="fd-detail" class="fd-sheet fd-detail" hidden aria-labelledby="fd-detail-h">
  <div class="fd-sheet-card fd-detail-card" role="dialog" aria-modal="true">
    <div class="fd-detail-head">
      <h2 id="fd-detail-h">ルート</h2>
      <a id="fd-detail-page" class="fd-detail-link" href="#">ページで開く</a>
      <button type="button" id="fd-detail-close" class="fd-x" aria-label="閉じる">×</button>
    </div>
    <div class="fd-detail-body"><p id="fd-detail-loading" class="fd-note">読み込み中…</p></div>
  </div>
</section>

<section id="fd-compare" class="fd-sheet" hidden aria-labelledby="fd-compare-h">
  <div class="fd-sheet-card">
    <h2 id="fd-compare-h">保存したルートを比べる</h2>
    <div class="fd-table-wrap"><table class="fd-table" id="fd-table"></table></div>
    <p id="fd-compare-empty" class="fd-note" hidden>まだ保存していません。気になるルートの「保存」を押してください。</p>
    <p class="fd-note">体力度・難易度は長野県「信州 山のグレーディング」。HutsGo のルートと区切りが違うものは「近い」と書いています。保存はこの端末の中だけです。</p>
    <button type="button" id="fd-compare-close" class="fd-btn">閉じる</button>
  </div>
</section>

<script src="{{ BASE }}/static/feed.js" defer></script>
</body>
</html>
