name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jinja2 markdown
      - name: Build site
        env:
          # repo variable SITE_URL wins (custom domain); otherwise project Pages URL https://<owner>.github.io/<repo>
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          ANALYTICS_SNIPPET: ${{ vars.ANALYTICS_SNIPPET }}
          # XServer 上の計測/投稿エンドポイント（例 https://api.hutsgo.com）。未設定なら計測も投稿フォームも無効
          API_URL: ${{ vars.API_URL }}
        run: python3 build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
